# nginx reverse proxy config (Phase 12 deploy)
# Mount tại /etc/nginx/conf.d/default.conf trong Docker.

upstream backend_api {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Cloudflare sẽ làm SSL termination + proxy về VPS:80.
    # Hoặc dùng Cloudflare Origin Cert nếu muốn HTTPS end-to-end.

    client_max_body_size 10M;

    # API routes
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        proxy_pass http://backend_api/health;
    }

    # Frontend (catch-all)
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support cho Next.js dev (HMR — chỉ dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
